<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Produção</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 20px 0;
        }

        nav button {
            background: #374151;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 0 5px;
            border-radius: 6px;
            cursor: pointer;
        }

        nav button:hover {
            background: #4b5563;
        }

        nav button.ativo {
            background: #2563eb;
        }

        .pagina {
            padding: 30px;
        }

        .oculta {
            display: none;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cadastrar {
            background: #16a34a;
            color: white;
        }

        .btn-editar {
            background: #2563eb;
            color: white;
        }

        .btn-excluir {
            background: #dc2626;
            color: white;
        }

        .btn-limpar {
            background: #6b7280;
            color: white;
        }

        .btn-modal {
            background: #7c3aed;
            color: white;
        }

        .pesquisa {
            margin-bottom: 20px;
        }

        .pesquisa input {
            width: 100%;
        }

        .tabela-container {
            background: white;
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        tbody tr {
            cursor: pointer;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        tr.selecionada {
            background: #dbeafe !important;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-conteudo {
            background: white;
            width: 400px;
            max-width: 90%;
            padding: 25px;
            border-radius: 10px;
        }

        .modal-conteudo h2 {
            margin-top: 0;
        }

        .modal-botoes {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 800px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .pagina {
                padding: 15px;
            }
        }

    </style>
</head>

<body>

<header>

    <h1>SISTEMA DE PRODUÇÃO</h1>

    <nav>

        <button
            id="btnOrdem"
            class="ativo"
            onclick="mostrarPagina('ordem')">
            Ordem de Produção
        </button>

        <button
            id="btnSimulacao"
            onclick="mostrarPagina('simulacao')">
            Simulação de Produção
        </button>

    </nav>

</header>


<!-- ========================================================= -->
<!-- ORDEM DE PRODUÇÃO -->
<!-- ========================================================= -->

<div id="paginaOrdem" class="pagina">

    <h2>Ordem de Produção</h2>

    <div class="form-grid">

        <div class="campo">

            <label>Código</label>

            <input
                type="text"
                id="codigoOP"
                placeholder="Ex: PROD001">

        </div>


        <div class="campo">

            <label>Linha</label>

            <input
                type="text"
                id="linhaOP"
                placeholder="Ex: Linha 01">

        </div>


        <div class="campo">

            <label>Subconjunto</label>

            <input
                type="text"
                id="subconjuntoOP"
                placeholder="Ex: SUB001">

        </div>


        <div class="campo">

            <label>Quantidade por Embalagem</label>

            <input
                type="number"
                id="quantidadeEmbalagemOP"
                placeholder="Ex: 100">

        </div>


        <div class="campo">

            <label>Ordem</label>

            <input
                type="number"
                id="ordemOP"
                placeholder="Ex: 1">

        </div>

    </div>


    <div class="botoes">

        <button
            class="btn-cadastrar"
            onclick="cadastrarOP()">
            Cadastrar
        </button>

        <button
            class="btn-editar"
            onclick="editarOP()">
            Editar
        </button>

        <button
            class="btn-excluir"
            onclick="excluirOP()">
            Excluir
        </button>

        <button
            class="btn-limpar"
            onclick="limparOP()">
            Limpar
        </button>

    </div>


    <div class="pesquisa">

        <input
            type="text"
            id="pesquisaOP"
            placeholder="Pesquisar código, linha, subconjunto ou ordem..."
            oninput="pesquisarOP()">

    </div>


    <div class="tabela-container">

        <table>

            <thead>

                <tr>

                    <th>Código</th>
                    <th>Linha</th>
                    <th>Subconjunto</th>
                    <th>Qtd. Embalagem</th>
                    <th>Ordem</th>

                </tr>

            </thead>

            <tbody id="tabelaOP"></tbody>

        </table>

    </div>

</div>



<!-- ========================================================= -->
<!-- SIMULAÇÃO DE PRODUÇÃO -->
<!-- ========================================================= -->

<div id="paginaSimulacao" class="pagina oculta">

    <h2>Simulação de Produção</h2>


    <div class="form-grid">

        <div class="campo">

            <label>Produto</label>

            <select id="produtoSimulacao"
                    onchange="carregarComponentes()">

                <option value="">
                    Selecione um produto
                </option>

            </select>

        </div>


        <div class="campo">

            <label>Quantidade de Produção</label>

            <input
                type="number"
                id="quantidadeProducao"
                placeholder="Ex: 200">

        </div>

    </div>


    <div class="botoes">

        <button
            class="btn-modal"
            onclick="abrirModalProduto()">
            Novo Produto
        </button>

        <button
            class="btn-excluir"
            onclick="excluirProduto()">
            Excluir Produto
        </button>

        <button
            class="btn-modal"
            onclick="abrirModalComponente()">
            Novo Componente
        </button>

        <button
            class="btn-excluir"
            onclick="excluirComponente()">
            Excluir Componente
        </button>

        <button
            class="btn-cadastrar"
            onclick="calcularProducao()">
            Calcular Produção
        </button>

    </div>


    <div class="tabela-container">

        <table>

            <thead>

                <tr>

                    <th>Componente</th>
                    <th>Quantidade</th>
                    <th>Embalagem</th>
                    <th>Capacidade</th>

                </tr>

            </thead>

            <tbody id="tabelaComponentes"></tbody>

        </table>

    </div>

</div>



<!-- ========================================================= -->
<!-- MODAL NOVO PRODUTO -->
<!-- ========================================================= -->

<div id="modalProduto" class="modal">

    <div class="modal-conteudo">

        <h2>Novo Produto</h2>

        <div class="campo">

            <label>Nome do Produto</label>

            <input
                type="text"
                id="nomeNovoProduto"
                placeholder="Nome do produto">

        </div>


        <div class="modal-botoes">

            <button
                class="btn-limpar"
                onclick="fecharModalProduto()">
                Cancelar
            </button>

            <button
                class="btn-cadastrar"
                onclick="criarProduto()">
                Salvar
            </button>

        </div>

    </div>

</div>



<!-- ========================================================= -->
<!-- MODAL NOVO COMPONENTE -->
<!-- ========================================================= -->

<div id="modalComponente" class="modal">

    <div class="modal-conteudo">

        <h2>Novo Componente</h2>


        <div class="campo">

            <label>Nome</label>

            <input
                type="text"
                id="nomeComponente"
                placeholder="Ex: Parafuso">

        </div>


        <div class="campo">

            <label>Quantidade por Produto</label>

            <input
                type="number"
                id="quantidadeComponente"
                placeholder="Ex: 4">

        </div>


        <div class="campo">

            <label>Embalagem</label>

            <input
                type="text"
                id="embalagemComponente"
                placeholder="Ex: Pacote">

        </div>


        <div class="campo">

            <label>Capacidade da Embalagem</label>

            <input
                type="number"
                id="capacidadeComponente"
                placeholder="Ex: 100">

        </div>


        <div class="modal-botoes">

            <button
                class="btn-limpar"
                onclick="fecharModalComponente()">
                Cancelar
            </button>

            <button
                class="btn-cadastrar"
                onclick="criarComponente()">
                Salvar
            </button>

        </div>

    </div>

</div>
